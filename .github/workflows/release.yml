# .github/workflows/release.yml on v3.25.x

name: Release 3.25.x on npm
on:
  # dispatch only: `gh workflow run release.yml --ref v3.25.x`, then the npm environment's reviewer approves the run and the staged version is approved on npm with 2FA
  workflow_dispatch:

# shares main's group, so a 3.x and a 4.x release never stage side by side
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test before staging
    steps:
      - name: Refuse to release from any ref but v3.25.x
        run: |
          [ "$GITHUB_REF" = "refs/heads/v3.25.x" ] || { echo "::error::this release.yml runs from v3.25.x only, got $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm run --filter @zod/resolution test:all

  stage:
    needs: test
    runs-on: ubuntu-latest
    # the npm trusted publisher is bound to this environment and to a workflow named release.yml; the environment's required reviewer approves the run, and npm's 2FA approval of the staged version is the second gate
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse to release from any ref but v3.25.x
        run: |
          [ "$GITHUB_REF" = "refs/heads/v3.25.x" ] || { echo "::error::this release.yml runs from v3.25.x only, got $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v4

      # `npm stage publish` needs npm 11.15 or later
      - name: Install an npm CLI that can stage
        run: |
          npm install -g npm@11
          v="$(npm --version)"
          [ "$(printf '%s\n11.15.0\n' "$v" | sort -V | head -1)" = "11.15.0" ] || { echo "::error::npm $v cannot stage (need >= 11.15)"; exit 1; }
          echo "npm $v at $(command -v npm)"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # a 3.x version must never reach `latest`, so the tag is explicit and the run stops if `latest` has left 4.x or the version is not a 3.25 patch
      - name: Refuse a version or registry state this release does not expect
        run: |
          version="$(node -p "require('./packages/zod/package.json').version")"
          case "$version" in 3.25.*) ;; *) echo "::error::v3.25.x releases 3.25.x only, got $version"; exit 1 ;; esac
          latest="$(npm view zod dist-tags.latest)"
          case "$latest" in 4.*) ;; *) echo "::error::npm latest is $latest, expected a 4.x"; exit 1 ;; esac
          if curl -sf "https://registry.npmjs.org/zod/$version" > /dev/null; then echo "::error::zod@$version is already published"; exit 1; fi
          echo "staging zod@$version under latest-3; latest stays $latest"

      - name: Stage zod on npm under latest-3
        working-directory: ./packages/zod
        run: npm stage publish --provenance --tag latest-3 --loglevel verbose

      - name: Say how to approve
        run: |
          {
            echo "## Staged on npm, waiting for approval"
            echo
            echo "zod@$(node -p "require('./packages/zod/package.json').version") is staged under \`latest-3\`. Check the tag with \`npm stage list zod\` before approving."
          } >> "$GITHUB_STEP_SUMMARY"
