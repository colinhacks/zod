# .github/release.yml

name: Release on npm
on:
  push:
    branches:
      - main
    paths:
      - "packages/zod/package.json"
      - "packages/mini/package.json"
      - ".github/workflows/release.yml"
  # back-publish @zod/mini at an x.y.z that zod already shipped without it; the peer floor becomes ^x.y.0
  workflow_dispatch:
    inputs:
      mini_version:
        description: "Publish @zod/mini at this x.y.z (must be an existing zod version)"
        required: true
        type: string

jobs:
  test-node:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["lts/*"]
        # Deliberately narrower than test.yml, which also runs a "latest" leg. This
        # matrix gates publishing, so a regression in a bleeding-edge compiler must
        # not be able to block a release. test.yml carries the TypeScript 7 signal.
        typescript: ["5.5", "6"]
    name: Test with TypeScript ${{ matrix.typescript }} on Node ${{ matrix.node }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      # Build with the repo-pinned TypeScript, which is what actually ships. zshy
      # uses the classic compiler API, which TypeScript 7 no longer provides.
      - run: pnpm build
      - run: pnpm add typescript@${{ matrix.typescript }} -w
      - run: pnpm test
      - run: pnpm run --filter @zod/resolution test:all
      - run: pnpm run --filter @zod/integration test:all

  lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["latest"]
    name: Lint on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm format:check
      - run: pnpm lint:check

  check-circular:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Check for circular dependencies
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm check:circular

  build_and_publish:
    if: github.event_name == 'push'
    needs: [test-node, lint, check-circular]
    runs-on: ubuntu-latest
    # 6h is GitHub's hard cap for a hosted runner, not a tunable. The two npm waits below share it, so neither can have the whole thing; a stall that outlives them needs the wait moved to its own job rather than a larger number here.
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm to latest (required for trusted publishing >=11.5.1)
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - run: pnpm run --filter @zod/resolution test:all
      - run: pnpm run prepublishOnly
        working-directory: ./packages/zod
      - run: pnpm run prepublishOnly
        working-directory: ./packages/mini

      # The versions being released, read from the manifests rather than from the publish steps: an action that decides the version is already on npm reports nothing, and the release still has to finish. `prepublishOnly` has already checked these against jsr.json and versions.ts.
      - name: Resolve the versions
        id: version
        run: |
          echo "zod=$(node -p "require('./packages/zod/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "mini=$(node -p "require('./packages/mini/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: publish
        name: Publish to NPM
        # npm refuses to publish over a version it has already staged, and the action reports that 409 inconsistently — sometimes as success, sometimes as a hard failure (JS-DevTools/npm-publish#245). Liveness below is the real gate, so this step does not get to decide the job.
        continue-on-error: true
        uses: JS-DevTools/npm-publish@v4
        with:
          # dry-run: true
          provenance: true
          package: ./packages/zod
      
      - name: Post-publish
        if: ${{ steps.publish.outputs.type }}
        run: |
          echo "Published ${{ steps.publish.outputs.type }} version: ${{ steps.publish.outputs.version }}"

      # npm can accept a publish and leave it staged: 4.5.0 sat there 16 minutes and 4.5.3 sat there 25, and neither is an upper bound — this package is downloaded enough that processing is routinely slow. The version does arrive, and the release and the JSR publish are worthless without it, so wait rather than fail. A publish that failed for some other reason waits the whole window and then fails with the publish step's log to read.
      - name: Wait for the version to be live on npm
        env:
          VERSION: ${{ steps.version.outputs.zod }}
        run: |
          for i in $(seq 1 150); do
            if curl -sf "https://registry.npmjs.org/zod/$VERSION" > /dev/null; then
              echo "zod@$VERSION is live"
              exit 0
            fi
            if [ $((i % 15)) -eq 0 ]; then echo "zod@$VERSION is not on the registry yet ($i minutes)"; fi
            sleep 60
          done
          echo "zod@$VERSION never reached the registry; see the publish step for why"
          exit 1

      - name: Configure changelog
        run: |
          echo '{"categories": [], "template": "## Commits:\n\n#{{UNCATEGORIZED}}", "pr_template": "- #{{MERGE_SHA}} #{{TITLE}}"}' > changelog_config.json
          cat changelog_config.json
          echo "last_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

      - name: Generate changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fromTag: "${{ env.last_tag }}"
          toTag: ${{ github.ref }}
          mode: COMMIT
          configuration: changelog_config.json

      # notes go through env and a file so a commit subject can't break out of the command
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.zod }}
          CHANGELOG: ${{ steps.github_release.outputs.changelog }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released"
            exit 0
          fi
          printf '%s' "$CHANGELOG" > "$RUNNER_TEMP/release_notes.md"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release_notes.md"

      # last so a jsr outage can't cost the tag — and it aborts on a dirty tree, so nothing above it may leave the workspace dirty
      - name: Publish to JSR
        env:
          VERSION: ${{ steps.version.outputs.zod }}
        working-directory: ./packages/zod
        run: |
          if curl -sf "https://jsr.io/@zod/zod/${VERSION}_meta.json" > /dev/null; then
            echo "@zod/zod@$VERSION is already on JSR"
            exit 0
          fi
          pnpm jsr publish --allow-slow-types # --dry-run

      # @zod/mini ships in lockstep with zod and is a no-op when its version is already on the registry, so it runs unconditionally (the first release of the scoped package rides on a merge that does not bump zod itself) and last, so a failed mini publish cannot cost zod its tag, GitHub release or JSR publish
      - id: publish_mini
        name: Publish @zod/mini to NPM
        continue-on-error: true
        uses: JS-DevTools/npm-publish@v4
        with:
          provenance: true
          package: ./packages/mini

      - name: Wait for @zod/mini to be live on npm
        env:
          VERSION: ${{ steps.version.outputs.mini }}
        run: |
          for i in $(seq 1 150); do
            if curl -sf "https://registry.npmjs.org/@zod%2fmini/$VERSION" > /dev/null; then
              echo "@zod/mini@$VERSION is live"
              exit 0
            fi
            if [ $((i % 15)) -eq 0 ]; then echo "@zod/mini@$VERSION is not on the registry yet ($i minutes)"; fi
            sleep 60
          done
          echo "@zod/mini@$VERSION never reached the registry; see the publish step for why"
          exit 1

      # JSR refuses a version that already exists, so the step checks first; this also lets the first JSR publish of a version already on npm ride on a merge that publishes nothing to npm
      - name: Publish @zod/mini to JSR
        working-directory: ./packages/mini
        run: |
          VERSION=$(node -p 'require("./jsr.json").version')
          if curl -sfL "https://jsr.io/@zod/mini/${VERSION}_meta.json" > /dev/null; then
            echo "@zod/mini@$VERSION is already on JSR"
          else
            pnpm jsr publish --allow-slow-types
          fi

      # every zod release from 4.5.0 on must have an @zod/mini twin on npm, whichever of the two publishes above ran
      - run: pnpm check:lockstep --wait

  backpublish_mini:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "latest"
          registry-url: https://registry.npmjs.org/
      - name: Upgrade npm to latest (required for trusted publishing >=11.5.1)
        run: npm install -g npm@latest
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - name: Set the @zod/mini version and peer floor
        env:
          VERSION: ${{ inputs.mini_version }}
        working-directory: ./packages/mini
        run: |
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "mini_version must be x.y.z, got '$VERSION'"
            exit 1
          fi
          if ! curl -sf "https://registry.npmjs.org/zod/$VERSION" > /dev/null; then
            echo "zod@$VERSION is not on npm; @zod/mini only ships versions zod shipped"
            exit 1
          fi
          export MAJOR="${BASH_REMATCH[1]}" MINOR="${BASH_REMATCH[2]}"
          npm pkg set version="$VERSION" peerDependencies.zod="^${MAJOR}.${MINOR}.0"
          node -e '
            const fs = require("fs");
            const jsr = JSON.parse(fs.readFileSync("jsr.json", "utf8"));
            jsr.version = process.env.VERSION;
            jsr.imports["zod/mini"] = `jsr:@zod/zod@^${process.env.MAJOR}.${process.env.MINOR}.0/mini`;
            fs.writeFileSync("jsr.json", JSON.stringify(jsr, null, 2) + "\n");
          '
          cat package.json jsr.json
      - run: pnpm build

      # npm refuses a bare publish of a version below latest, so an older version goes out under a throwaway dist-tag that leaves latest alone (remove it afterwards with `npm dist-tag rm @zod/mini backfill`); the version that IS zod's latest takes latest, so the lockstep check can pass
      - id: tag
        name: Pick the dist-tag
        env:
          VERSION: ${{ inputs.mini_version }}
        run: |
          ZOD_LATEST=$(npm view zod version)
          if [ "$VERSION" = "$ZOD_LATEST" ]; then echo "tag=latest" >> "$GITHUB_OUTPUT"; else echo "tag=backfill" >> "$GITHUB_OUTPUT"; fi
          echo "zod latest is $ZOD_LATEST; publishing @zod/mini@$VERSION under $([ "$VERSION" = "$ZOD_LATEST" ] && echo latest || echo backfill)"

      # the lockstep check in prepublishOnly is deliberately skipped: this version is older than versions.ts by design
      - id: publish_mini
        name: Publish @zod/mini to NPM
        continue-on-error: true
        uses: JS-DevTools/npm-publish@v4
        with:
          provenance: true
          ignore-scripts: true
          tag: ${{ steps.tag.outputs.tag }}
          package: ./packages/mini

      # the dispatch input is the version, already checked against npm above, so this does not depend on what the publish step reported
      - name: Wait for @zod/mini to be live on npm
        env:
          VERSION: ${{ inputs.mini_version }}
        run: |
          for i in $(seq 1 150); do
            if curl -sf "https://registry.npmjs.org/@zod%2fmini/$VERSION" > /dev/null; then
              echo "@zod/mini@$VERSION is live"
              exit 0
            fi
            if [ $((i % 15)) -eq 0 ]; then echo "@zod/mini@$VERSION is not on the registry yet ($i minutes)"; fi
            sleep 60
          done
          echo "@zod/mini@$VERSION never reached the registry; see the publish step for why"
          exit 1

      # the version edit above leaves the tree dirty by design
      - name: Publish @zod/mini to JSR
        working-directory: ./packages/mini
        env:
          VERSION: ${{ inputs.mini_version }}
        run: |
          if curl -sfL "https://jsr.io/@zod/mini/${VERSION}_meta.json" > /dev/null; then
            echo "@zod/mini@$VERSION is already on JSR"
          else
            pnpm jsr publish --allow-slow-types --allow-dirty
          fi

      - run: pnpm check:lockstep --wait
