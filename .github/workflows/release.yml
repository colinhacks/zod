# .github/release.yml

name: Release on npm
on:
  push:
    branches:
      - main
    paths:
      - "packages/zod/package.json"
      - "packages/mini/package.json"
      - ".github/workflows/release.yml"
  # back-publish @zod/mini at an x.y.z that zod already shipped without it; the peer floor becomes ^x.y.0
  workflow_dispatch:
    inputs:
      mini_version:
        description: "Publish @zod/mini at this x.y.z (must be an existing zod version)"
        required: true
        type: string

jobs:
  test-node:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["lts/*"]
        # Deliberately narrower than test.yml, which also runs a "latest" leg. This
        # matrix gates publishing, so a regression in a bleeding-edge compiler must
        # not be able to block a release. test.yml carries the TypeScript 7 signal.
        typescript: ["5.5", "6"]
    name: Test with TypeScript ${{ matrix.typescript }} on Node ${{ matrix.node }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      # Build with the repo-pinned TypeScript, which is what actually ships. zshy
      # uses the classic compiler API, which TypeScript 7 no longer provides.
      - run: pnpm build
      - run: pnpm add typescript@${{ matrix.typescript }} -w
      - run: pnpm test
      - run: pnpm run --filter @zod/resolution test:all
      - run: pnpm run --filter @zod/integration test:all

  lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["latest"]
    name: Lint on Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm format:check
      - run: pnpm lint:check

  check-circular:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Check for circular dependencies
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "latest"
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm check:circular

  build_and_publish:
    if: github.event_name == 'push'
    needs: [test-node, lint, check-circular]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm to latest (required for trusted publishing >=11.5.1)
        run: npm install -g npm@latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - run: pnpm run --filter @zod/resolution test:all
      - run: pnpm run prepublishOnly
        working-directory: ./packages/zod
      - run: pnpm run prepublishOnly
        working-directory: ./packages/mini

      - id: publish
        name: Publish to NPM
        uses: JS-DevTools/npm-publish@v4
        with:
          # dry-run: true
          provenance: true
          package: ./packages/zod
      
      - name: Post-publish
        if: ${{ steps.publish.outputs.type }}
        run: |
          echo "Published ${{ steps.publish.outputs.type }} version: ${{ steps.publish.outputs.version }}"

      # npm can accept a publish and never finish processing it (4.5.0 sat in a phantom "staged" state); the action still reports success, so nothing below may run until the registry actually serves the version
      - name: Verify the version is live on npm
        if: ${{ steps.publish.outputs.type }}
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            if curl -sf "https://registry.npmjs.org/zod/$VERSION" > /dev/null; then
              echo "zod@$VERSION is live"
              exit 0
            fi
            sleep 15
          done
          echo "zod@$VERSION is not on the registry after 10 minutes; stopping before the GitHub release and the JSR publish"
          exit 1

      - name: Configure changelog
        if: ${{ steps.publish.outputs.type }}
        run: |
          echo '{"categories": [], "template": "## Commits:\n\n#{{UNCATEGORIZED}}", "pr_template": "- #{{MERGE_SHA}} #{{TITLE}}"}' > changelog_config.json
          cat changelog_config.json
          echo "last_tag=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

      - name: Generate changelog
        if: ${{ steps.publish.outputs.type }}
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fromTag: "${{ env.last_tag }}"
          toTag: ${{ github.ref }}
          mode: COMMIT
          configuration: changelog_config.json

      # notes go through env and a file so a commit subject can't break out of the command
      - name: Create release
        if: ${{ steps.publish.outputs.type }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
          CHANGELOG: ${{ steps.github_release.outputs.changelog }}
        run: |
          printf '%s' "$CHANGELOG" > "$RUNNER_TEMP/release_notes.md"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release_notes.md"

      # last so a jsr outage can't cost the tag — and it aborts on a dirty tree, so nothing above it may leave the workspace dirty
      - run: pnpm jsr publish --allow-slow-types # --dry-run
        if: ${{ steps.publish.outputs.type }}
        working-directory: ./packages/zod

      # @zod/mini ships in lockstep with zod and is a no-op when its version is already on the registry, so it runs unconditionally (the first release of the scoped package rides on a merge that does not bump zod itself) and last, so a failed mini publish cannot cost zod its tag, GitHub release or JSR publish
      - id: publish_mini
        name: Publish @zod/mini to NPM
        uses: JS-DevTools/npm-publish@v4
        with:
          provenance: true
          package: ./packages/mini

      - name: Verify @zod/mini is live on npm
        if: ${{ steps.publish_mini.outputs.type }}
        env:
          VERSION: ${{ steps.publish_mini.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            if curl -sf "https://registry.npmjs.org/@zod%2fmini/$VERSION" > /dev/null; then
              echo "@zod/mini@$VERSION is live"
              exit 0
            fi
            sleep 15
          done
          echo "@zod/mini@$VERSION is not on the registry after 10 minutes"
          exit 1

  backpublish_mini:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "latest"
          registry-url: https://registry.npmjs.org/
      - name: Upgrade npm to latest (required for trusted publishing >=11.5.1)
        run: npm install -g npm@latest
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - name: Set the @zod/mini version and peer floor
        env:
          VERSION: ${{ inputs.mini_version }}
        working-directory: ./packages/mini
        run: |
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "mini_version must be x.y.z, got '$VERSION'"
            exit 1
          fi
          if ! curl -sf "https://registry.npmjs.org/zod/$VERSION" > /dev/null; then
            echo "zod@$VERSION is not on npm; @zod/mini only ships versions zod shipped"
            exit 1
          fi
          npm pkg set version="$VERSION" peerDependencies.zod="^${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
          cat package.json
      - run: pnpm build

      # the lockstep check in prepublishOnly is deliberately skipped: this version is older than versions.ts by design
      - id: publish_mini
        name: Publish @zod/mini to NPM
        uses: JS-DevTools/npm-publish@v4
        with:
          provenance: true
          ignore-scripts: true
          package: ./packages/mini

      - name: Verify @zod/mini is live on npm
        if: ${{ steps.publish_mini.outputs.type }}
        env:
          VERSION: ${{ steps.publish_mini.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            if curl -sf "https://registry.npmjs.org/@zod%2fmini/$VERSION" > /dev/null; then
              echo "@zod/mini@$VERSION is live"
              exit 0
            fi
            sleep 15
          done
          echo "@zod/mini@$VERSION is not on the registry after 10 minutes"
          exit 1
