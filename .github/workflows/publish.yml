name: Publish to npm (token)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0
        with:
          nub-version: "0.8.3"
          registry-url: https://registry.npmjs.org/
      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
      - id: version
        run: |
          ZOD=$(node -p "require('./packages/zod/package.json').version")
          MINI=$(node -p "require('./packages/mini/package.json').version")
          echo "zod=$ZOD" >> "$GITHUB_OUTPUT"
          echo "mini=$MINI" >> "$GITHUB_OUTPUT"
      - id: gate
        name: Skip when both versions are already on npm
        run: |
          if curl -sf "https://registry.npmjs.org/zod/${{ steps.version.outputs.zod }}" > /dev/null \
             && curl -sf "https://registry.npmjs.org/@zod%2fmini/${{ steps.version.outputs.mini }}" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        run: nub install --frozen-lockfile
      - if: steps.gate.outputs.skip != 'true'
        run: nub run build
      - if: steps.gate.outputs.skip != 'true'
        run: nub run test
      - name: Publish zod
        if: steps.gate.outputs.skip != 'true'
        working-directory: ./packages/zod
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if curl -sf "https://registry.npmjs.org/zod/${{ steps.version.outputs.zod }}" > /dev/null; then
            echo "zod@${{ steps.version.outputs.zod }} already published"
            exit 0
          fi
          nub publish --no-git-checks
      - name: Publish @zod/mini
        if: steps.gate.outputs.skip != 'true'
        working-directory: ./packages/mini
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if curl -sf "https://registry.npmjs.org/@zod%2fmini/${{ steps.version.outputs.mini }}" > /dev/null; then
            echo "@zod/mini@${{ steps.version.outputs.mini }} already published"
            exit 0
          fi
          nub publish --no-git-checks --access public
