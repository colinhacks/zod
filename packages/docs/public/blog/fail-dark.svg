<svg xmlns="http://www.w3.org/2000/svg" width="720" height="102" viewBox="0 0 720 102" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13"><title>Time per failing safeParse, zod 4.4 versus 4.5</title><text x="90" y="16" fill="#a3a29b" font-size="12">time per failing safeParse() — lower is better</text><text x="78" y="47" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">zod 4.4</text><rect x="90" y="34" width="550.0" height="18" rx="4" fill="#5c5b57"/><text x="648.0" y="47" fill="#a3a29b" font-weight="400" font-size="12">6.3 µs</text><text x="78" y="77" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">zod 4.5</text><rect x="90" y="64" width="72.8" height="18" rx="4" fill="#3987e5"/><text x="170.8" y="77" fill="#ffffff" font-weight="700" font-size="12">840 ns</text><text x="224.0" y="77" fill="#3987e5" font-weight="700" font-size="12">7.6&#215; faster</text></svg>