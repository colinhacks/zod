<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13"><title>Time per parse, standard parser versus compiled</title><text x="250" y="16" fill="#6b6a66" font-size="12">time per parse</text><rect x="432" y="6" width="10" height="10" rx="2" fill="#e9e8e4"/><text x="446" y="15" fill="#6b6a66" font-size="12">standard parser</text><rect x="544" y="6" width="10" height="10" rx="2" fill="#2a78d6"/><text x="558" y="15" fill="#6b6a66" font-size="12">compiled</text><line x1="250.0" y1="26" x2="250.0" y2="308" stroke="#e6e5e1" stroke-width="1"/><text x="250.0" y="324" text-anchor="middle" fill="#6b6a66" font-size="11">0</text><line x1="322.0" y1="26" x2="322.0" y2="308" stroke="#e6e5e1" stroke-width="1"/><text x="322.0" y="324" text-anchor="middle" fill="#6b6a66" font-size="11">100</text><line x1="394.0" y1="26" x2="394.0" y2="308" stroke="#e6e5e1" stroke-width="1"/><text x="394.0" y="324" text-anchor="middle" fill="#6b6a66" font-size="11">200</text><line x1="466.0" y1="26" x2="466.0" y2="158" stroke="#e6e5e1" stroke-width="1"/><line x1="466.0" y1="274" x2="466.0" y2="308" stroke="#e6e5e1" stroke-width="1"/><text x="466.0" y="324" text-anchor="middle" fill="#6b6a66" font-size="11">300</text><line x1="538.0" y1="26" x2="538.0" y2="158" stroke="#e6e5e1" stroke-width="1"/><line x1="538.0" y1="274" x2="538.0" y2="308" stroke="#e6e5e1" stroke-width="1"/><text x="538.0" y="324" text-anchor="middle" fill="#6b6a66" font-size="11">400</text><line x1="610.0" y1="26" x2="610.0" y2="158" stroke="#e6e5e1" stroke-width="1"/><line x1="610.0" y1="274" x2="610.0" y2="308" stroke="#e6e5e1" stroke-width="1"/><text x="610.0" y="324" text-anchor="middle" fill="#6b6a66" font-size="11">500 ns</text><text x="238" y="51" text-anchor="end" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">z.array(z.object()), 10 items</text><rect x="250" y="37" width="271.7" height="20" rx="4" fill="#e9e8e4"/><rect x="250" y="37" width="49.3" height="20" rx="4" fill="#2a78d6"/><text x="306.26445432774545" y="51" fill="#0b0b0b" font-weight="700" font-size="12">68 ns</text><text x="529.7" y="51" fill="#6b6a66" font-size="12">5.5x faster</text><text x="238" y="85" text-anchor="end" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">z.object(), 20 keys</text><rect x="250" y="71" width="216.5" height="20" rx="4" fill="#e9e8e4"/><rect x="250" y="71" width="27.7" height="20" rx="4" fill="#2a78d6"/><text x="284.66039185555127" y="85" fill="#0b0b0b" font-weight="700" font-size="12">38 ns</text><text x="474.5" y="85" fill="#6b6a66" font-size="12">7.8x faster</text><text x="238" y="119" text-anchor="end" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">z.array(z.string()), 10 items</text><rect x="250" y="105" width="173.5" height="20" rx="4" fill="#e9e8e4"/><rect x="250" y="105" width="23.8" height="20" rx="4" fill="#2a78d6"/><text x="280.77414561664193" y="119" fill="#0b0b0b" font-weight="700" font-size="12">33 ns</text><text x="431.5" y="119" fill="#6b6a66" font-size="12">7.3x faster</text><text x="238" y="153" text-anchor="end" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">z.union() of 3 objects</text><rect x="250" y="139" width="136.9" height="20" rx="4" fill="#e9e8e4"/><rect x="250" y="139" width="25.8" height="20" rx="4" fill="#2a78d6"/><text x="282.7602862254025" y="153" fill="#0b0b0b" font-weight="700" font-size="12">36 ns</text><text x="394.9" y="153" fill="#6b6a66" font-size="12">5.3x faster</text><text x="238" y="187" text-anchor="end" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">z.tuple() of 3</text><rect x="250" y="173" width="86.0" height="20" rx="4" fill="#e9e8e4"/><rect x="250" y="173" width="23.6" height="20" rx="4" fill="#2a78d6"/><text x="280.6259228876128" y="187" fill="#0b0b0b" font-weight="700" font-size="12">33 ns</text><text x="344.0" y="187" fill="#6b6a66" font-size="12">3.6x faster</text><text x="238" y="221" text-anchor="end" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">z.strictObject(), 5 keys</text><rect x="250" y="207" width="84.0" height="20" rx="4" fill="#e9e8e4"/><rect x="250" y="207" width="22.8" height="20" rx="4" fill="#2a78d6"/><text x="279.75240954337175" y="221" fill="#0b0b0b" font-weight="700" font-size="12">32 ns</text><text x="342.0" y="221" fill="#6b6a66" font-size="12">3.7x faster</text><text x="238" y="255" text-anchor="end" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">z.discriminatedUnion()</text><rect x="250" y="241" width="66.5" height="20" rx="4" fill="#e9e8e4"/><rect x="250" y="241" width="19.4" height="20" rx="4" fill="#2a78d6"/><text x="276.4331983805668" y="255" fill="#0b0b0b" font-weight="700" font-size="12">27 ns</text><text x="324.5" y="255" fill="#6b6a66" font-size="12">3.4x faster</text><text x="238" y="289" text-anchor="end" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">z.object(), 5 keys</text><rect x="250" y="275" width="54.8" height="20" rx="4" fill="#e9e8e4"/><rect x="250" y="275" width="19.9" height="20" rx="4" fill="#2a78d6"/><text x="276.8565912851627" y="289" fill="#0b0b0b" font-weight="700" font-size="12">28 ns</text><text x="321.9" y="289" fill="#6b6a66" font-size="12">2.8x faster</text><text x="530" y="180" text-anchor="middle" fill="#6b6a66" font-size="16">up to</text><text x="530" y="238" text-anchor="middle" fill="#2a78d6" font-weight="800" font-size="62">7.8&#215;</text><text x="530" y="264" text-anchor="middle" fill="#0b0b0b" font-weight="600" font-size="14">faster when compiled</text></svg>